<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="static/icon.png" />
<title>Spark</title>
<style>
  :root {
    --bg: #fbfaf8; --surface: #fff; --border: #e5e1da; --text: #1f1d1a;
    --muted: #6b6560; --accent: #4a4640; --accent-soft: #f0eeea;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171614; --surface: #201e1b; --border: #34302b; --text: #ece8e2;
      --muted: #9a938b; --accent: #b5aea5; --accent-soft: #2a2724;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 16px 64px; background: var(--bg); color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  header { padding: 56px 0 8px; }
  h1 {
    margin: 0; font-size: 30px; letter-spacing: -.02em; font-weight: 650;
    display: flex; align-items: center; gap: 10px;
  }
  .mark { width: .78em; height: .78em; fill: currentColor; flex: none; }
  .sub { color: var(--muted); margin-top: 6px; font-size: 14px; }
  .grid { display: grid; gap: 16px; margin-top: 32px; }
  /* 四张卡片，2 列刚好 2×2 铺满；原来是 3 列，4 张卡会在第二行剩一张、
     右边空出两列宽度，两侧看着不对称。 */
  @media (min-width: 720px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 22px; display: flex; flex-direction: column; text-decoration: none; color: inherit;
    transition: border-color .2s, transform .2s;
  }
  a.card:hover { border-color: var(--accent); transform: translateY(-2px); }

  /* 默认是中性灰，整页不带颜色；颜色只在悬停时出现，指向你正要点的那一块。
     --accent 重新定义在悬停的卡片自身上，边框、tagline、标签都用 var(--accent)，
     所以整块会一起变色，另一块完全不受影响。 */
  a.card[data-key="summit"]:hover  { --accent: #5836c9; --accent-soft: #edeafb; }
  a.card[data-key="podcast"]:hover { --accent: #1f5fb8; --accent-soft: #e8eff8; }
  a.card[data-key="track"]:hover   { --accent: #c2410c; --accent-soft: #f8e8df; }
  a.card[data-key="notes"]:hover  { --accent: #1a6b43; --accent-soft: #e6f3ec; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) a.card[data-key="summit"]:hover {
      --accent: #a894ea; --accent-soft: #221d30;
    }
    :root:not([data-theme="light"]) a.card[data-key="podcast"]:hover {
      --accent: #6aabee; --accent-soft: #1b2634;
    }
    :root:not([data-theme="light"]) a.card[data-key="track"]:hover {
      --accent: #e2895c; --accent-soft: #2f2019;
    }
    :root:not([data-theme="light"]) a.card[data-key="notes"]:hover {
      --accent: #63c48d; --accent-soft: #19271f;
    }
  }
  :root[data-theme="dark"] a.card[data-key="summit"]:hover {
    --accent: #a894ea; --accent-soft: #221d30;
  }
  :root[data-theme="dark"] a.card[data-key="podcast"]:hover {
    --accent: #6aabee; --accent-soft: #1b2634;
  }
  :root[data-theme="dark"] a.card[data-key="track"]:hover {
    --accent: #e2895c; --accent-soft: #2f2019;
  }
  :root[data-theme="dark"] a.card[data-key="notes"]:hover {
    --accent: #63c48d; --accent-soft: #19271f;
  }
  .card h2 { margin: 0; font-size: 18px; font-weight: 620; }
  .tagline { color: var(--accent); font-size: 13px; margin-top: 4px; transition: color .2s; }
  .detail { color: var(--muted); font-size: 13.5px; margin-top: 12px; flex: 1; }
  .tasks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
  .tag {
    font-size: 12px; padding: 3px 9px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
    transition: background-color .2s, color .2s;
  }
  .foot {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border);
    font-size: 12.5px; color: var(--muted);
  }
  .foot .path { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .note { margin-top: 36px; font-size: 13px; color: var(--muted); }
  .note code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
    background: var(--accent-soft); padding: 1px 5px; border-radius: 4px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>
      <!-- 星芒：和 assets/Spark.icns 同一条 astroid 曲线（power 3.6）。四段三次
           贝塞尔，控制点系数 0.432R 让曲线在 45° 处穿过 2^-1.8·R，与图标严格一致。
           用 currentColor 而不是图标那套紫蓝渐变——落地页默认是中性灰，颜色只在
           悬停某张卡片时出现，标题旁挂个渐变会把这条规矩破掉。 -->
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M23 12C16.75 12 12 16.75 12 23C12 16.75 7.25 12 1 12C7.25 12 12 7.25 12 1C12 7.25 16.75 12 23 12Z"/>
      </svg>Spark</h1>
    <div class="sub">选一个任务开始。同一个服务、同一套模型后端、API Key 和笔记库路径。</div>
  </header>
  <div class="grid" id="grid"></div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
